name: release

# ⚠️ **ふだんは使わない。** 2026-08-29 にウェブストアの限定公開へ掲載してから、
# 利用者への配布はストア一本にした (docs/setup-and-verify.md「9. 新しい版をストアへ出す」)。
# **タグを push しても Release は作られない** — 打っても出ない形にしてある。
# 手順書に「打つな」と書くより機構を外すほうが確実で、Release が復活すると
# 「ストアより古い版が最新に見える」状態に戻るため。
#
# それでも ZIP を Release へ出す事情ができたときだけ、Actions タブから手で起動する
# (対象のタグを選ぶ。タグと package.json の版が食い違っていれば下の照合で止まる)。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # タグと package.json の版が食い違ったまま出さない
      - name: バージョンの照合
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と package.json の $version が食い違っている" >&2
            exit 1
          fi

      # 壊れたものを配らない
      - run: npm run typecheck
      - run: npm test

      - run: npm run package

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" \
            "release/shoutlink-${version}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
